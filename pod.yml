pipeline {
    agent any

    stages {

        stage('Checkout') {
            steps {
                git 'https://github.com/<your-username>/<your-repository>.git'
            }
        }

        stage('Build') {
            steps {
                sh 'mvn clean package'
            }
        }

        stage('Test') {
            steps {
                sh 'mvn test'
            }
        }
    }

    post {
        success {
            echo 'Build Successful'
        }
        failure {
            echo 'Build Failed'
        }
    }
}
